name: CI - Kaline IA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Backend Tests (FastAPI & PyTorch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r saas_backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Pytest Suite
        run: |
          PYTHONPATH=. pytest tests/ -v

  build-frontend:
    name: Frontend Build (React & TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: saas_frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./saas_frontend
        run: |
          npm install

      - name: Typecheck and Build Frontend
        working-directory: ./saas_frontend
        run: |
          npm run build
